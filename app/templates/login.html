<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hawal Tunnel - ورود به مدیریت</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #070d1b;
      --card-bg: rgba(15, 25, 48, 0.88);
      --card-border: rgba(59, 130, 246, 0.32);
      --input-bg: #0b1528;
      --input-border: rgba(59, 130, 246, 0.28);
      --input-focus: #3b82f6;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --primary-glow: rgba(37, 99, 235, 0.45);
      --accent-cyan: #06b6d4;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --text-label: #e2e8f0;
      --danger: #ef4444;
      --success: #10b981;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Vazirmatn', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      min-height: 100vh;
      background: radial-gradient(circle at 50% 20%, #162646 0%, #0c152a 50%, #050913 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 60px 20px 40px;
      color: var(--text-main);
      position: relative;
      overflow-y: auto;
    }

    /* Ambient background grid */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: 
        linear-gradient(to right, rgba(59, 130, 246, 0.04) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(59, 130, 246, 0.04) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
      z-index: 1;
    }

    .login-container {
      width: 100%;
      max-width: 460px;
      margin: auto 0;
      position: relative;
      z-index: 10;
    }

    .card {
      background: var(--card-bg);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 40px 36px;
      box-shadow: 
        0 25px 60px rgba(0, 0, 0, 0.65),
        0 0 50px rgba(37, 99, 235, 0.15),
        inset 0 1px 0 rgba(255, 255, 255, 0.08);
      transition: all 0.3s ease;
    }

    /* Header styling */
    .brand-header {
      text-align: center;
      margin-bottom: 28px;
    }

    .badge-setup {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(16, 185, 129, 0.16);
      border: 1px solid rgba(16, 185, 129, 0.35);
      color: #34d399;
      font-size: 12.5px;
      font-weight: 600;
      padding: 5px 14px;
      border-radius: 9999px;
      margin-bottom: 12px;
      letter-spacing: 0.2px;
    }

    .brand-title {
      font-size: 30px;
      font-weight: 800;
      letter-spacing: 1px;
      background: linear-gradient(135deg, #93c5fd 0%, #3b82f6 50%, #38bdf8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      display: inline-block;
      text-shadow: 0 0 35px rgba(59, 130, 246, 0.4);
    }

    .brand-bar {
      width: 48px;
      height: 3.5px;
      background: linear-gradient(90deg, #3b82f6, #06b6d4);
      border-radius: 4px;
      margin: 10px auto 14px;
      box-shadow: 0 0 12px rgba(59, 130, 246, 0.6);
    }

    .brand-subtitle {
      font-size: 22px;
      font-weight: 700;
      color: var(--text-main);
      letter-spacing: -0.3px;
    }

    .brand-desc {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 6px;
      line-height: 1.6;
    }

    /* Form Fields */
    .form-group {
      margin-bottom: 20px;
      text-align: right;
    }

    .form-label {
      display: block;
      font-size: 13.5px;
      font-weight: 600;
      color: var(--text-label);
      margin-bottom: 8px;
      letter-spacing: 0.2px;
    }

    /* Fixed Input Box: direction ltr for clean icon-left + text + icon-right */
    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
      background: var(--input-bg);
      border: 1.5px solid var(--input-border);
      border-radius: 12px;
      height: 52px;
      padding: 0 14px;
      gap: 10px;
      direction: ltr; /* Keeps icon left, text middle, eye right */
      transition: all 0.2s ease;
      overflow: hidden;
    }

    .input-wrapper:focus-within {
      border-color: var(--input-focus);
      box-shadow: 0 0 0 3.5px rgba(59, 130, 246, 0.28);
      background: #091222;
    }

    .input-icon {
      color: #64748b;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      pointer-events: none;
      transition: color 0.2s;
    }

    .input-wrapper:focus-within .input-icon {
      color: #60a5fa;
    }

    .form-input {
      flex: 1;
      height: 100%;
      background: transparent !important;
      border: none !important;
      outline: none !important;
      color: var(--text-main) !important;
      font-family: 'Inter', 'Vazirmatn', sans-serif;
      font-size: 14.5px;
      font-weight: 500;
      letter-spacing: 0.4px;
      direction: ltr;
      text-align: left;
      padding: 0;
    }

    .form-input::placeholder {
      color: #475569;
      font-size: 13.5px;
      letter-spacing: normal;
    }

    /* Override browser autofill white box (Chrome / Edge / Brave / Google Password Manager) */
    .form-input:-webkit-autofill,
    .form-input:-webkit-autofill:hover, 
    .form-input:-webkit-autofill:focus, 
    .form-input:-webkit-autofill:active {
      -webkit-box-shadow: 0 0 0 1000px #0b1528 inset !important;
      -webkit-text-fill-color: #f8fafc !important;
      caret-color: #f8fafc !important;
      background-color: transparent !important;
      transition: background-color 5000s ease-in-out 0s;
    }

    .toggle-password {
      background: transparent;
      border: none;
      color: #64748b;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4px;
      flex-shrink: 0;
      transition: color 0.2s;
      outline: none;
    }

    .toggle-password:hover {
      color: #93c5fd;
    }

    /* Prominent Centered Password Generator Button */
    .generator-container {
      margin: 8px 0 20px;
      text-align: center;
    }

    .btn-generator {
      width: 100%;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      background: linear-gradient(135deg, rgba(37, 99, 235, 0.16) 0%, rgba(6, 182, 212, 0.16) 100%);
      border: 1.5px solid rgba(59, 130, 246, 0.42);
      color: #93c5fd;
      font-size: 14px;
      font-weight: 600;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.22s ease;
      box-shadow: 0 4px 15px rgba(37, 99, 235, 0.12);
    }

    .btn-generator:hover {
      background: linear-gradient(135deg, rgba(37, 99, 235, 0.32) 0%, rgba(6, 182, 212, 0.32) 100%);
      border-color: #60a5fa;
      color: #ffffff;
      box-shadow: 0 0 22px rgba(59, 130, 246, 0.35);
      transform: translateY(-1.5px);
    }

    .btn-generator:active {
      transform: translateY(0);
    }

    .btn-generator svg {
      color: #38bdf8;
    }

    .copied-toast {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: #34d399;
      margin-top: 6px;
      min-height: 18px;
      opacity: 0;
      transition: opacity 0.25s ease;
    }

    .copied-toast.show {
      opacity: 1;
    }

    /* Helper info text */
    .helper-text {
      font-size: 11.5px;
      color: #64748b;
      margin-top: 6px;
      line-height: 1.5;
      text-align: right;
    }

    /* Submit Button */
    .btn-submit {
      width: 100%;
      height: 50px;
      background: var(--primary);
      color: #ffffff;
      border: none;
      border-radius: 12px;
      font-size: 15.5px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 4px 16px var(--primary-glow);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-top: 24px;
    }

    .btn-submit:hover {
      background: var(--primary-hover);
      box-shadow: 0 6px 24px rgba(37, 99, 235, 0.6);
      transform: translateY(-1.5px);
    }

    .btn-submit:active {
      transform: translateY(0);
    }

    .btn-submit:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    /* Alert Message */
    .alert-box {
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 13.5px;
      margin-bottom: 20px;
      display: none;
      align-items: center;
      gap: 10px;
      line-height: 1.4;
    }

    .alert-error {
      background: rgba(239, 68, 68, 0.16);
      border: 1px solid rgba(239, 68, 68, 0.4);
      color: #fca5a5;
    }

    .alert-success {
      background: rgba(16, 185, 129, 0.16);
      border: 1px solid rgba(16, 185, 129, 0.4);
      color: #6ee7b7;
    }

    /* Spinner */
    .spinner {
      width: 18px;
      height: 18px;
      border: 2.5px solid rgba(255, 255, 255, 0.3);
      border-top-color: #ffffff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      display: none;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <div class="login-container">
    <div class="card">
      
      <!-- Brand Header -->
      <div class="brand-header">
        <div id="setup-badge-container"></div>
        <div class="brand-title">HAWAL</div>
        <div class="brand-bar"></div>
        <div class="brand-subtitle" id="page-subtitle">Hello</div>
        <div class="brand-desc" id="page-desc">برای دسترسی به پنل مدیریت تانل‌ها وارد شوید</div>
      </div>

      <!-- Alert Notification -->
      <div id="alert-box" class="alert-box alert-error">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
        <span id="alert-message">خطا در ورود</span>
      </div>

      <!-- Main Form: supports native browser autofill & save password -->
      <form id="auth-form" method="POST" autocomplete="on">
        
        <!-- Username Field -->
        <div class="form-group">
          <label class="form-label" for="username-input" id="username-label">Username</label>
          <div class="input-wrapper">
            <span class="input-icon">
              <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
            </span>
            <input 
              type="text" 
              id="username-input" 
              name="username" 
              class="form-input" 
              placeholder="Username" 
              autocomplete="username" 
              required
              autofocus
            >
          </div>
        </div>

        <!-- Password Field -->
        <div class="form-group">
          <label class="form-label" for="password-input" id="password-label">Password</label>
          <div class="input-wrapper">
            <span class="input-icon">
              <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
            </span>
            <input 
              type="password" 
              id="password-input" 
              name="password" 
              class="form-input" 
              placeholder="Password" 
              autocomplete="current-password" 
              required
            >
            <button type="button" class="toggle-password" onclick="toggleVisibility('password-input', this)" title="نمایش/پنهان کردن رمز">
              <svg class="eye-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
            </button>
          </div>
        </div>

        <!-- Dynamic First-Time Setup Fields -->
        <div id="first-time-container" style="display: none;">
          
          <!-- Confirm Password Field -->
          <div class="form-group">
            <label class="form-label" for="confirm-password-input">تایید کلمه عبور (Confirm Password)</label>
            <div class="input-wrapper">
              <span class="input-icon">
                <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
              </span>
              <input 
                type="password" 
                id="confirm-password-input" 
                name="confirm_password" 
                class="form-input" 
                placeholder="Confirm Password" 
                autocomplete="new-password"
              >
              <button type="button" class="toggle-password" onclick="toggleVisibility('confirm-password-input', this)" title="نمایش/پنهان کردن رمز">
                <svg class="eye-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
              </button>
            </div>
          </div>

          <!-- Password Generator: Centered and Larger -->
          <div class="generator-container">
            <button type="button" class="btn-generator" onclick="generateStrongPassword()">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon></svg>
              تولید خودکار کلمه عبور قوی و ایمن
            </button>
            <span class="copied-toast" id="copied-toast">✓ کلمه عبور تولید و کپی شد</span>
          </div>

          <div class="helper-text">
            💡 می‌توانید رمز قویِ تولیدشده را نگه دارید یا رمز دلخواه خود را تایپ نمایید. مرورگر به صورت خودکار پیشنهاد ذخیره رمز را به شما نمایش خواهد داد.
          </div>

        </div>

        <!-- Remember Me Checkbox -->
        <div style="display: flex; align-items: center; justify-content: flex-start; margin: 4px 0 20px; font-size: 13.5px; color: var(--text-label);">
          <label style="display: flex; align-items: center; gap: 8px; cursor: pointer; user-select: none;">
            <input type="checkbox" id="remember-me" name="remember" checked style="width: 17px; height: 17px; accent-color: var(--primary); cursor: pointer; border-radius: 4px;">
            <span>مرا به خاطر بسپار (ذخیره نشست ۳۰ روزه)</span>
          </label>
        </div>

        <!-- Submit Button -->
        <button type="submit" class="btn-submit" id="btn-submit">
          <span class="spinner" id="btn-spinner"></span>
          <span id="btn-text">Log In</span>
        </button>

      </form>

    </div>
  </div>

  <script>
    let IS_FIRST_TIME = false;

    // Toggle password text visibility
    function toggleVisibility(inputId, btn) {
      const input = document.getElementById(inputId);
      if (!input) return;
      if (input.type === 'password') {
        input.type = 'text';
        btn.innerHTML = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>`;
      } else {
        input.type = 'password';
        btn.innerHTML = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>`;
      }
    }

    // Generate strong 16-character password using Web Crypto API
    function generateStrongPassword() {
      const chars = "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789!@#$%^&*()_+~|}{[]";
      let password = "";
      const randomValues = new Uint32Array(16);
      window.crypto.getRandomValues(randomValues);
      for (let i = 0; i < 16; i++) {
        password += chars[randomValues[i] % chars.length];
      }

      const pwInput = document.getElementById('password-input');
      const confirmInput = document.getElementById('confirm-password-input');
      pwInput.value = password;
      confirmInput.value = password;
      pwInput.type = 'text';
      confirmInput.type = 'text';

      // Clipboard copy feedback
      navigator.clipboard.writeText(password).then(() => {
        const toast = document.getElementById('copied-toast');
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 3000);
      }).catch(() => {});
    }

    function showAlert(msg, isSuccess = false) {
      const box = document.getElementById('alert-box');
      const text = document.getElementById('alert-message');
      box.className = `alert-box ${isSuccess ? 'alert-success' : 'alert-error'}`;
      text.innerText = msg;
      box.style.display = 'flex';
    }

    function hideAlert() {
      document.getElementById('alert-box').style.display = 'none';
    }

    // Initialize state from server
    async function checkAuthStatus() {
      try {
        const res = await fetch('/api/auth/status');
        const data = await res.json();
        
        if (data.authenticated) {
          window.location.href = '/';
          return;
        }

        IS_FIRST_TIME = Boolean(data.is_first_time);
        
        if (IS_FIRST_TIME) {
          // Render First-time Setup View
          document.getElementById('setup-badge-container').innerHTML = `
            <span class="badge-setup">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>
              راه‌اندازی اولیه پنل
            </span>
          `;
          document.getElementById('page-subtitle').innerText = 'راه‌اندازی حساب مدیریت';
          document.getElementById('page-desc').innerText = 'نام کاربری و کلمه عبور دلخواه خود را تعیین نمایید';
          document.getElementById('username-label').innerText = 'نام کاربری دلخواه (Username)';
          document.getElementById('username-input').placeholder = 'مثلاً admin یا نام دلخواه';
          document.getElementById('username-input').value = 'admin';
          document.getElementById('password-label').innerText = 'کلمه عبور جدید (New Password)';
          document.getElementById('password-input').setAttribute('autocomplete', 'new-password');
          document.getElementById('confirm-password-input').required = true;
          document.getElementById('first-time-container').style.display = 'block';
          document.getElementById('btn-text').innerText = 'ذخیره و ورود به پنل';
        } else {
          // Ant Design Login View
          document.getElementById('page-subtitle').innerText = 'Hello';
          document.getElementById('page-desc').innerText = 'برای ورود، نام کاربری و رمز عبور را وارد کنید';
          document.getElementById('username-label').innerText = 'Username';
          document.getElementById('password-label').innerText = 'Password';
          document.getElementById('password-input').setAttribute('autocomplete', 'current-password');
          document.getElementById('first-time-container').style.display = 'none';
          document.getElementById('btn-text').innerText = 'Log In';
        }
      } catch (e) {
        console.error("Auth status error:", e);
      }
    }

    // Handle Form Submit
    document.getElementById('auth-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      hideAlert();

      const username = document.getElementById('username-input').value.trim();
      const password = document.getElementById('password-input').value;
      const confirmPassword = document.getElementById('confirm-password-input').value;

      if (IS_FIRST_TIME) {
        if (!username) {
          showAlert('لطفاً نام کاربری را وارد کنید.');
          return;
        }
        if (password.length < 6) {
          showAlert('کلمه عبور باید حداقل ۶ کاراکتر باشد.');
          return;
        }
        if (password !== confirmPassword) {
          showAlert('کلمه عبور و تکرار آن یکسان نیستند.');
          return;
        }
      }

      const submitBtn = document.getElementById('btn-submit');
      const spinner = document.getElementById('btn-spinner');
      const btnText = document.getElementById('btn-text');

      submitBtn.disabled = true;
      spinner.style.display = 'inline-block';

      try {
        const endpoint = IS_FIRST_TIME ? '/api/auth/setup' : '/api/auth/login';
        const res = await fetch(endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await res.json();

        if (res.ok && data.success) {
          if (data.token) {
            localStorage.setItem('hawal_session', data.token);
          }
          showAlert('ورود موفقیت‌آمیز بود. در حال انتقال...', true);
          setTimeout(() => {
            window.location.href = '/';
          }, 300);
        } else {
          showAlert(data.error || 'اطلاعات ورود نادرست است.');
          submitBtn.disabled = false;
          spinner.style.display = 'none';
        }
      } catch (err) {
        showAlert('خطا در برقراری ارتباط با سرور.');
        submitBtn.disabled = false;
        spinner.style.display = 'none';
      }
    });

    checkAuthStatus();
  </script>
</body>
</html>
